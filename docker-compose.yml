services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_NAME_TEST: ${DB_NAME_TEST}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # BACKEND_URL/FRONTEND_URL = l'URL publique unique (voir .env) car Nginx sert
      # tout sur la même origine. Ne sert vraiment que pour la callback GitHub OAuth.
      BACKEND_URL: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      MODEL_PROVIDER_URL: ${MODEL_PROVIDER_URL}
      MODEL_NAME: ${MODEL_NAME}
      API_KEY: ${API_KEY}
    extra_hosts:
      # Permet au conteneur d'atteindre un serveur IA (LM Studio/Ollama) tournant
      # sur la machine hôte, sans dépendre de l'IP LAN de celle-ci.
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-80}:80"

volumes:
  db_data:
