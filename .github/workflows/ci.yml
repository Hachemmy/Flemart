name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: change_moi_root
          MYSQL_DATABASE: flemart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchange_moi_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: flemart_agent
      DB_PASSWORD: change_moi
      DB_NAME: flemart
      DB_NAME_TEST: flemart_test
      JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_ci_secret_ci_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Create database user and test database
        working-directory: backend
        run: |
          node -e "
          const mysql = require('mysql2/promise');
          (async () => {
            const c = await mysql.createConnection({ host: '127.0.0.1', user: 'root', password: 'change_moi_root', multipleStatements: true });
            await c.query('CREATE DATABASE IF NOT EXISTS flemart_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
            await c.query(\"CREATE USER IF NOT EXISTS 'flemart_agent'@'%' IDENTIFIED BY 'change_moi'\");
            await c.query(\"GRANT ALL PRIVILEGES ON flemart.* TO 'flemart_agent'@'%'\");
            await c.query(\"GRANT ALL PRIVILEGES ON flemart_test.* TO 'flemart_agent'@'%'\");
            await c.query('FLUSH PRIVILEGES');
            console.log('DB ready');
            await c.end();
          })();
          "

      - name: Run migrations (main DB)
        run: npm run migrate
        working-directory: backend

      - name: Run migrations (test DB)
        run: DB_NAME=flemart_test npm run migrate
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Test
        run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend
