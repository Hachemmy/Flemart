server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> proxifiée vers le conteneur backend (résolu par le DNS interne Docker,
    # jamais par une IP en dur : fonctionne quel que soit l'hôte/IP utilisé par le client)
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:5000/health;
    }

    # SPA React Router : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
